spring:
  application:
    name: auth-api-starter-kit

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    show-sql: ${SPRING_JPA_SHOW_SQL}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true

  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  email-verification:
    base-url: ${APP_EMAIL_VERIFICATION_BASE_URL}
    token-expiration-hours: ${APP_EMAIL_VERIFICATION_TOKEN_EXPIRATION_HOURS}
    subject: ${APP_EMAIL_VERIFICATION_SUBJECT}
    cleanup-cron: ${APP_EMAIL_VERIFICATION_CLEANUP_CRON}

  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL}
